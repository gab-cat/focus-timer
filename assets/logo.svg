<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#bg)"/>

  <g stroke="#34d399" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#glow)">
    <path d="M 280 720 Q 420 560 560 600" stroke-dasharray="4 36"/>
  </g>

  <circle cx="280" cy="720" r="18" fill="#34d399" opacity="0.5"/>
  <circle cx="280" cy="720" r="10" fill="#34d399"/>

  <g transform="translate(560 320) rotate(18)">
    <path d="M 0 0 L 0 360 L 95 270 L 155 410 L 215 385 L 155 245 L 285 245 Z"
          fill="url(#cursor)"
          stroke="#0a0a0a"
          stroke-width="14"
          stroke-linejoin="round"/>
  </g>
</svg>
